name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # All history and tags: tests/test_freeze.py checks the M6 freeze against the
      # m6-freeze tag, not against HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      # The exact versions the committed ground truth was built with (requirements.lock),
      # then the package itself without letting pip re-resolve anything.
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest
        env:
          HYPOTHESIS_PROFILE: ci

  demo-image:
    # The demo's Docker image, built and started with no key (examples mode): /health, the
    # examples, and one example solved through the replay path. Then live mode without a
    # key must refuse to start. Nothing in this job has a key, so nothing can spend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t opt-agent-demo .

      - name: Start it in examples mode
        run: docker run -d --name demo -p 8000:8000 opt-agent-demo

      - name: Smoke test
        run: python3 scripts/demo_smoke.py http://localhost:8000 --example paint

      - name: Live mode without a key refuses to start
        run: |
          if docker run --rm -e OPT_AGENT_LIVE=1 opt-agent-demo; then
            echo "live mode started without a key"; exit 1
          fi

      - name: Server log
        if: always()
        run: docker logs demo

  reproduce:
    # Every reported number, from the committed runs, by each study's frozen code
    # (scripts/reproduce.py): every answer replayed from the run's cached replies with a
    # client that refuses every request, then the reports and results files rebuilt byte
    # for byte. LLM4OR's data (the follow-up's keys) is fetched at its pinned commit and
    # checked against its recorded hashes; it's never committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags: each study rebuilds from its own

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Fetch LLM4OR's cleaned benchmarks
        run: python scripts/fetch_llm4or.py

      - name: Reproduce
        run: |
          set -o pipefail
          python scripts/reproduce.py 2>&1 | grep -v HighsMipSolverData | tee reproduce.log

      # The log needs a GitHub sign-in to read; an annotation is shown on the run's page.
      - name: What didn't reproduce
        if: failure()
        run: |
          python3 -c "import sys; t = open('reproduce.log').read()[-3500:]; print('::error title=reproduce::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"

  screenshot:
    # The README's screenshot, captured headlessly (scripts/screenshot.py: the app
    # in-process, in examples mode) and kept as an artifact, so the script stays working.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install playwright==1.65.2
          python -m playwright install --with-deps --only-shell chromium

      - name: Capture
        run: python scripts/screenshot.py --out demo.png

      - uses: actions/upload-artifact@v4
        with:
          name: demo-screenshot
          path: demo.png
