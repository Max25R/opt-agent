name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # Actions > CI > Run workflow: on main, that deploys the static demo too

# Least privilege: CI only needs to read the code (deploy-pages adds what it needs).
permissions:
  contents: read

jobs:
  # timeout-minutes is a hang guard, not a speed alarm: well above a normal run on a slow
  # runner, and far below GitHub's 6-hour default.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # All history and tags: tests/test_freeze.py checks the M6 freeze against the
      # m6-freeze tag, not against HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      # The exact versions the committed ground truth was built with (requirements.lock),
      # then the package itself without letting pip re-resolve anything.
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest
        env:
          HYPOTHESIS_PROFILE: ci

  types:
    # mypy on src/ (its settings are in pyproject.toml), from the optional
    # requirements-checks.lock: a new type error fails CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-checks.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install -r requirements-checks.lock -c requirements.lock

      - name: mypy
        run: python -m mypy

  demo-image:
    # The demo's Docker image, built and started with no key (examples mode): /health, the
    # examples, and one example solved through the replay path. Then live mode without a
    # key must refuse to start. Nothing in this job has a key, so nothing can spend.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t opt-agent-demo .

      - name: Start it in examples mode
        run: docker run -d --name demo -p 8000:8000 opt-agent-demo

      - name: Smoke test
        run: python3 scripts/demo_smoke.py http://localhost:8000 --example paint

      # It must stop for the missing key, not for any other reason, and not hang: a live
      # start would serve forever, so the timeout turns that into a failure.
      - name: Live mode without a key refuses to start
        run: |
          set +e
          timeout 60 docker run --rm -e OPT_AGENT_LIVE=1 opt-agent-demo > live.log 2>&1
          status=$?
          set -e
          cat live.log
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "live mode started without a key (or hung)"; exit 1
          fi
          grep -q "MissingAPIKeyError" live.log || {
            echo "live mode failed to start, but not for the missing key"; exit 1; }

      - name: Server log
        if: always()
        run: docker logs demo

  reproduce:
    # Every reported number, from the committed runs, by each study's frozen code
    # (scripts/reproduce.py): every answer replayed from the run's cached replies with a
    # client that refuses every request, then the reports and results files rebuilt byte
    # for byte. LLM4OR's data (the follow-up's keys) is fetched at its pinned commit and
    # checked against its recorded hashes; it's never committed.
    # On macOS arm64, where both studies ran: on Linux x86_64 CBC returns another, equally
    # optimal solution for one follow-up model, which changes one pair's revision path (not
    # its answer), and four p-values differ in their 16th digit (docs/HANDOFF.md).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags: each study rebuilds from its own

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Fetch LLM4OR's cleaned benchmarks
        run: python scripts/fetch_llm4or.py

      - name: Reproduce
        run: |
          set -o pipefail
          python scripts/reproduce.py 2>&1 | grep -v HighsMipSolverData | tee reproduce.log

      # The log needs a GitHub sign-in to read; an annotation is shown on the run's page.
      - name: What didn't reproduce
        if: failure()
        run: |
          python3 -c "import sys; t = open('reproduce.log').read()[-3500:]; print('::error title=reproduce::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"

      # The checks the test job has to skip: with the rest of the data (NL4Opt's raw
      # annotations, ORLM's answers and ORLMBenchmark, pinned and hash-checked by
      # opt_agent.data; never committed) and Pillow (the committed screenshot's checks), the
      # whole suite runs here, after the rebuild, and no test may skip. It runs under
      # coverage (requirements-checks.lock), since only here does every test run.
      - name: Fetch the rest of the data, Pillow and coverage
        run: |
          python -m opt_agent.data
          pip install -r requirements-docs.lock -c requirements.lock
          pip install -r requirements-checks.lock -c requirements.lock

      - name: Test, with all the data, under coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          set -o pipefail
          python -m coverage run -m pytest 2>&1 | tee pytest.log
          if grep -q "^SKIPPED" pytest.log; then
            grep "^SKIPPED" pytest.log
            echo "::error title=pytest::a test skipped with all the data present"; exit 1
          fi

      # The report goes on the run's page; the README's badge must be within a point of it.
      - name: Coverage report
        run: |
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python scripts/coverage_badge.py --check

  pictures:
    # The docs' pictures, from a fresh clone with the optional requirements-docs.lock: the
    # README's screenshot, captured headlessly (scripts/screenshot.py: the app in-process, in
    # examples mode) and kept as an artifact, and the IE 2310 figures (scripts/ie2310.py),
    # so both scripts stay working.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-docs.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install -r requirements-docs.lock -c requirements.lock
          python -m playwright install --with-deps --only-shell chromium

      - name: The IE 2310 figures
        run: python scripts/ie2310.py

      # The committed docs/demo.png's frame (the problem card through the explanation, the
      # same margins); with this runner's fonts the cards' heights differ, the frame doesn't.
      - name: The screenshot, in the committed frame
        run: |
          set -o pipefail
          { python scripts/screenshot.py --out demo.png \
            && python scripts/screenshot.py --check demo.png; } 2>&1 | tee pictures.log

      # The log needs a GitHub sign-in to read; an annotation is shown on the run's page.
      - name: What went wrong
        if: failure()
        run: |
          python3 -c "import sys; t = open('pictures.log').read()[-3500:]; print('::error title=pictures::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"

      - uses: actions/upload-artifact@v4
        if: always()  # a picture that fails the check is worth seeing too
        with:
          name: demo-screenshot
          path: demo.png

  plugin:
    # The repository is a plugin marketplace for the Agent Skill (.claude-plugin/marketplace.json
    # lists skills/opt-agent/). Claude Code's own validator checks the marketplace file and the
    # plugin it points to. The CLI is pinned; the job has no key and logs in to nothing, and
    # the README's install commands stay only while this passes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.311

      - name: Validate the marketplace and the plugin
        run: |
          claude --version
          claude plugin validate .
          claude plugin validate ./skills/opt-agent

  static-demo:
    # The demo as a static site for GitHub Pages (scripts/static_demo.py): the examples page
    # with no server and no key. The build runs the demo app in-process, replaying the
    # committed replies (both solvers and the checks run here), and saves its responses next
    # to the page; then headless Chromium checks the site under its base path: every example
    # verified and equal to its hand-checked answer, and no request but its own files.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read  # only to ask whether Pages is on (below)
    outputs:
      pages: ${{ steps.pages.outputs.source }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-docs.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install -r requirements-docs.lock -c requirements.lock
          python -m playwright install --with-deps --only-shell chromium

      - name: Build the site
        run: python scripts/static_demo.py --out site

      - name: Check it in a browser
        run: python scripts/static_demo.py --check site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # deploy-pages fails unless the repository's Pages source is "GitHub Actions"
      # (Settings > Pages), so ask first: until then the deploy is skipped, not failed.
      - name: Is Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reply=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          source=$(jq -r '.build_type // "off"' <<< "$reply")
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [ "$source" != workflow ]; then
            echo "::notice title=pages::not deployed: the Pages source isn't GitHub Actions" \
              "(Settings > Pages). The API said: $(jq -c . <<< "$reply" | head -c 300)"
          fi

  deploy-pages:
    # The static demo goes live from main only, once the tests pass and Pages is on.
    needs: [test, static-demo]
    if: github.ref == 'refs/heads/main' && needs.static-demo.outputs.pages == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write  # deploy-pages proves where the artifact came from
    concurrency:
      group: pages
      cancel-in-progress: false  # never cut a deployment off halfway
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
