[build-system]
requires = ["setuptools>=77"]  # 77+ reads an SPDX `license` string
build-backend = "setuptools.build_meta"

[project]
name = "opt-agent"
version = "0.1.0"
description = "An LLM agent that turns plain-English optimization problems into linear programs, solves them, verifies the result, and explains it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pulp[cbc]>=4.0.1,<5",
    # cbcbox ships the CBC binary. 2.931+ crash on Apple Silicon (a bundled dylib has an
    # invalid code signature, so macOS kills the process); 2.929 is the newest that works.
    "cbcbox==2.929",
    "scipy>=1.11",
    "certifi",  # CA certificates for downloading datasets (python.org's macOS Python has none)
    "anthropic>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6.100",
]
# The web demo (src/opt_agent/demo/): only it imports these, so the studies' code never does.
demo = [
    "fastapi>=0.163",
    "uvicorn>=0.54",
]

[tool.setuptools.package-data]
# The demo's page and the examples' cached replies ship with the package (and the image).
"opt_agent.demo" = ["page.html", "replies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `live` call the real Claude API (it costs money): deselected here, and
# skipped whatever -m says unless OPT_AGENT_LIVE=1 (tests/conftest.py).
addopts = "-ra -m 'not live'"
markers = ["live: calls the real Claude API; run with `python -m pytest -m live`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: standard errors, I: import sorting, UP: modern syntax, B: common bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Type checks on src/ (CI's `types` job). Not --strict: it catches wrong types and unchecked
# None without rewriting working code. The plugin reads pydantic models' constructors.
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No stubs: scipy (scipy-stubs would be one more dependency), PuLP and cbcbox.
module = ["scipy", "scipy.*", "pulp", "pulp.*", "cbcbox", "cbcbox.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Line coverage of the package. CI's reproduce job runs the whole suite under it, with all
# the data; scripts/coverage_badge.py turns the total into the README's badge.
source = ["opt_agent"]
