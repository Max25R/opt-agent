[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opt-agent"
version = "0.1.0"
description = "An LLM agent that turns plain-English optimization problems into linear programs, solves them, verifies the result, and explains it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pulp[cbc]>=4.0.1,<5",
    # cbcbox ships the CBC binary. 2.931+ crash on Apple Silicon (a bundled dylib has an
    # invalid code signature, so macOS kills the process); 2.929 is the newest that works.
    "cbcbox==2.929",
    "scipy>=1.11",
    "certifi",  # CA certificates for downloading datasets (python.org's macOS Python has none)
    "anthropic>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `live` call the real Claude API (it costs money): skipped unless -m live.
addopts = "-ra -m 'not live'"
markers = ["live: calls the real Claude API; run with `python -m pytest -m live`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: standard errors, I: import sorting, UP: modern syntax, B: common bug patterns
select = ["E", "F", "I", "UP", "B"]
